<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Proxmox three-tier home lab architecture</title>
  <desc id="desc">A Proxmox VE 9.1.1 host runs FortiGate and three server VMs. FortiGate separates the DMZ web server from the Internal application and database servers. App-to-DB stays within the Internal segment. Documentation-only addresses are used.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 750; }
      .subtitle { font-size: 15px; fill: #475569; }
      .zone-title { font-size: 16px; font-weight: 700; letter-spacing: .04em; }
      .node-title { font-size: 20px; font-weight: 750; }
      .node-body { font-size: 14px; fill: #334155; }
      .flow-label { font-size: 13px; font-weight: 650; }
      .legend { font-size: 13px; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="54" y="62" class="title">Proxmox 3-Tier Home Lab</text>
  <text x="54" y="91" class="subtitle">Sanitized logical architecture — documentation addresses only</text>

  <rect x="210" y="108" width="955" height="435" rx="28" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="235" y="140" class="zone-title" fill="#334155">PROXMOX VE 9.1.1 HOST</text>

  <rect x="455" y="155" width="230" height="370" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="480" y="190" class="zone-title" fill="#1d4ed8">DMZ · 198.51.100.0/24</text>

  <rect x="710" y="155" width="440" height="370" rx="24" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="735" y="190" class="zone-title" fill="#15803d">INTERNAL · 203.0.113.0/24</text>

  <g filter="url(#shadow)">
    <rect x="50" y="265" width="145" height="120" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="122" y="306" text-anchor="middle" class="node-title">Client</text>
    <text x="122" y="336" text-anchor="middle" class="node-body">HTTP access</text>
    <text x="122" y="359" text-anchor="middle" class="node-body">evidence pending</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="230" y="208" width="195" height="235" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="327" y="263" text-anchor="middle" class="node-title">FortiGate</text>
    <text x="255" y="288" class="node-body">VMID 200</text>
    <text x="255" y="316" class="node-body">port1 · 192.0.2.2/24</text>
    <text x="255" y="348" class="node-body">port2 · DMZ</text>
    <text x="255" y="372" class="node-body">198.51.100.1/24</text>
    <text x="255" y="404" class="node-body">port3 · Internal</text>
    <text x="255" y="428" class="node-body">203.0.113.1/24</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="485" y="250" width="170" height="150" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="570" y="292" text-anchor="middle" class="node-title">web01</text>
    <text x="570" y="318" text-anchor="middle" class="node-body">VMID 108</text>
    <text x="570" y="340" text-anchor="middle" class="node-body">Nginx 1.20.1</text>
    <text x="570" y="362" text-anchor="middle" class="node-body">TCP/80</text>
    <text x="570" y="384" text-anchor="middle" class="node-body">198.51.100.10</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="250" width="170" height="150" rx="18" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
    <text x="825" y="292" text-anchor="middle" class="node-title">app01</text>
    <text x="825" y="318" text-anchor="middle" class="node-body">VMID 109</text>
    <text x="825" y="340" text-anchor="middle" class="node-body">Flask 3.1.3</text>
    <text x="825" y="362" text-anchor="middle" class="node-body">TCP/5000</text>
    <text x="825" y="384" text-anchor="middle" class="node-body">203.0.113.10</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="950" y="250" width="170" height="150" rx="18" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
    <text x="1035" y="292" text-anchor="middle" class="node-title">db01</text>
    <text x="1035" y="318" text-anchor="middle" class="node-body">VMID 110</text>
    <text x="1035" y="340" text-anchor="middle" class="node-body">PostgreSQL 13.23</text>
    <text x="1035" y="362" text-anchor="middle" class="node-body">TCP/5432</text>
    <text x="1035" y="384" text-anchor="middle" class="node-body">203.0.113.20</text>
  </g>

  <path d="M195 325 H230" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowAmber)"/>
  <path d="M425 325 H485" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowAmber)"/>
  <path d="M655 325 H740" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M910 325 H950" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <rect x="655" y="195" width="195" height="42" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="752" y="213" text-anchor="middle" class="flow-label" fill="#166534">TCP/5000 allow</text>
  <text x="752" y="231" text-anchor="middle" class="flow-label" fill="#166534">NAT disabled</text>

  <rect x="914" y="416" width="210" height="48" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="1019" y="436" text-anchor="middle" class="flow-label" fill="#166534">Same Internal segment</text>
  <text x="1019" y="454" text-anchor="middle" class="flow-label" fill="#166534">TCP/5432 verified after reboot</text>

  <line x1="55" y1="592" x2="110" y2="592" stroke="#15803d" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="127" y="597" class="legend">Verified in-lab path / control</text>
  <line x1="305" y1="592" x2="360" y2="592" stroke="#b45309" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowAmber)"/>
  <text x="377" y="597" class="legend">External path; evidence pending</text>

  <rect x="50" y="635" width="1100" height="46" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="600" y="655" text-anchor="middle" class="subtitle">App → DB remains inside Internal and does not traverse FortiGate</text>
  <text x="600" y="676" text-anchor="middle" class="subtitle">RFC 5737 ranges · No raw exports · No credentials · No real host addresses</text>
</svg>
