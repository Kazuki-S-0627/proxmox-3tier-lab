# Documentation-only inventory. These are RFC 5737 addresses, not live values.
hypervisor:
  platform: Proxmox VE
  version: 9.1.1

firewall:
  platform: FortiGate
  vmid: 200
  interfaces:
    port1:
      role: uplink
      address: 192.0.2.2/24
    port2:
      role: dmz
      address: 198.51.100.1/24
    port3:
      role: internal
      address: 203.0.113.1/24

hosts:
  web01:
    vmid: 108
    zone: dmz
    address: 198.51.100.10/24
    service: nginx
    service_version: 1.20.1
    os: Rocky Linux 9.8
    port: 80/tcp
  app01:
    vmid: 109
    zone: internal
    address: 203.0.113.10/24
    service: flask
    service_version: 3.1.3
    runtime: Python 3.9.25
    os: Rocky Linux 9.8
    port: 5000/tcp
  db01:
    vmid: 110
    zone: internal
    address: 203.0.113.20/24
    service: postgresql
    service_version: 13.23
    port: 5432/tcp
