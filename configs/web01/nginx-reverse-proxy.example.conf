# Public-safe scaffold, not a verbatim host export.
# Only proxy_pass, Host, and X-Real-IP below mirror the verified directives.
# The application address is an RFC 5737 documentation value.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://203.0.113.10:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
