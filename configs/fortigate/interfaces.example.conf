# Public reconstruction. Addresses are RFC 5737 documentation values.
# Interface names reflect the recorded port roles; aliases are descriptive.

config system interface
    edit "port1"
        set alias "UPLINK-DOCS"
        set ip 192.0.2.2 255.255.255.0
    next
    edit "port2"
        set alias "DMZ-DOCS"
        set ip 198.51.100.1 255.255.255.0
    next
    edit "port3"
        set alias "INTERNAL-DOCS"
        set ip 203.0.113.1 255.255.255.0
    next
end
